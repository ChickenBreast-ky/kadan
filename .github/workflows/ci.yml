name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install tmux (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: install tmux (macos)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: node --test tests/*.test.mjs
        env:
          KADAN_HOME: ${{ runner.temp }}/kadan-home
  public-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-public-strings.mjs
      - name: no tracked files under docs/daily
        run: |
          if git ls-files docs/daily | grep -q .; then echo "docs/daily must not be tracked"; exit 1; fi
